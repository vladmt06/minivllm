<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>dust</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;background:#000;overflow:hidden;
    overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  /* Fixed, not flow-positioned: the vibration polyfill reparents <body>'s
     children into a <label> and sets `display:contents` on body, which would
     collapse a percentage-height canvas. inset:0 is immune to that. */
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  #gate{
    position:fixed;inset:0;z-index:10;
    display:grid;place-items:center;background:#000;
    transition:opacity .9s ease;
  }
  #gate p{
    color:#fff;
    font:300 13px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    letter-spacing:.3em;
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.3}50%{opacity:.85}}
  #gate.hide{opacity:0;pointer-events:none}

  #hud{
    position:fixed;left:0;top:0;z-index:20;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 10px 10px;
    font:400 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#6f6;background:rgba(0,0,0,.55);
    white-space:pre;pointer-events:none;display:none;
  }
  #hud.on{display:block}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="gate"><p>tap to begin</p></div>
<div id="hud"></div>

<script type="module">
// Installs navigator.vibrate on iOS/macOS Safari. Must load before first use.
// polyfillKind reports which strategy it picked ('' when native vibrate exists).
import { polyfillKind } from './ios-vibrate.js';
window.__polyfillKind = String(polyfillKind);
</script>

<script>
(() => {
'use strict';

const QS    = new URLSearchParams(location.search);
const DEBUG = QS.has('debug');
// Escape hatches for the two things I can't verify without your device:
const FLIP_X = QS.has('flipx');
const FLIP_Y = QS.has('flipy');
const NO_ROT = QS.has('norot');   // disable landscape compensation

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const gate = document.getElementById('gate');
const hud  = document.getElementById('hud');
if (DEBUG) hud.classList.add('on');

let W = 0, H = 0, DPR = 1;

/* ─────────────────────────── dust sprite ─────────────────────────── */
const sprite = (() => {
  const s = document.createElement('canvas');
  s.width = s.height = 64;
  const g = s.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.18, 'rgba(255,255,255,0.55)');
  grd.addColorStop(0.45, 'rgba(255,255,255,0.12)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  return s;
})();

/* ─────────────────────────── particles ─────────────────────────── */
const P = [];

function makeParticle(x, y) {
  const depth = Math.pow(Math.random(), 1.7);   // 0 far … 1 near
  return {
    x, y,
    vx: (Math.random() - 0.5) * 0.2,
    vy: (Math.random() - 0.5) * 0.2,
    r: 0.5 + depth * 2.1,
    mass: 0.45 + depth * 0.9,
    alpha: 0.12 + depth * 0.55,
    tw: 0.7 + Math.random() * 1.9,
    seed: Math.random() * Math.PI * 2,
  };
}

const targetCount = () => Math.max(180, Math.min(480, Math.round((W * H) / 1400)));

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  const t = targetCount();
  while (P.length < t) P.push(makeParticle(Math.random() * W, Math.random() * H));
  while (P.length > t) P.pop();
  for (const p of P) { p.x = Math.min(p.x, W); p.y = Math.min(p.y, H); }
}

/* ─────────────────────────── gravity ─────────────────────────── *
 * Read the accelerometer vector directly instead of reconstructing it from
 * beta/gamma Euler angles. Euler reconstruction was the old bug: the two tilt
 * axes aren't independent (gamma's contribution scales with cos(beta)), and
 * gamma is clamped to ±90° so face-up and face-down are indistinguishable —
 * which made gravity snap and flip near vertical.
 *
 * Device frame (W3C): +x = right edge, +y = top edge, +z = out of screen.
 * iOS reports accelerationIncludingGravity as the gravity vector itself;
 * the spec (and Android) report its negation. Hence SIGN.
 *
 * Canvas frame: +x = right (same as device), +y = DOWN (device -y).
 *   gx =  ax/G * SIGN
 *   gy = -ay/G * SIGN
 */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const SIGN = IS_IOS ? 1 : -1;
const G0 = 9.80665;

const grav = {
  x: 0, y: 0.35,        // smoothed, screen space
  tx: 0, ty: 0.35,      // target
  raw: [0, 0, 0],
  src: 'none',
  perm: 'unrequested',
};

function setGravityFromDevice(dx, dy) {
  // dx,dy are device-frame components of the unit gravity vector.
  let sx = dx, sy = dy;

  // Compensate for landscape: rotate the vector into the current screen frame.
  if (!NO_ROT) {
    const deg = (screen.orientation && typeof screen.orientation.angle === 'number')
      ? screen.orientation.angle
      : (window.orientation || 0);
    if (deg) {
      const a = deg * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
      sx = dx * ca + dy * sa;
      sy = -dx * sa + dy * ca;
    }
  }

  if (FLIP_X) sx = -sx;
  if (FLIP_Y) sy = -sy;

  // Deadzone kills hand-tremor drift when the phone is held nominally flat.
  const m = Math.hypot(sx, sy);
  if (m < 0.045) { sx = 0; sy = 0; }

  grav.tx = Math.max(-1, Math.min(1, sx));
  grav.ty = Math.max(-1, Math.min(1, sy));
}

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || (a.x == null && a.y == null && a.z == null)) return;
  const ax = a.x || 0, ay = a.y || 0, az = a.z || 0;
  grav.raw = [ax, ay, az];
  grav.src = 'motion';
  setGravityFromDevice((ax / G0) * SIGN, -(ay / G0) * SIGN);
}

// Fallback only — used when DeviceMotion is unavailable. Includes the cos(beta)
// term that the original version was missing.
function onOrientation(e) {
  if (grav.src === 'motion') return;
  if (e.beta == null && e.gamma == null) return;
  const b = (e.beta || 0) * Math.PI / 180;
  const g = (e.gamma || 0) * Math.PI / 180;
  grav.raw = [e.gamma || 0, e.beta || 0, e.alpha || 0];
  grav.src = 'orient';
  setGravityFromDevice(Math.cos(b) * Math.sin(g), Math.sin(b));
}

/* ─────────────────────────── haptics ─────────────────────────── */
const Haptics = (() => {
  let timer = null, calls = 0, ok = false;

  const has = () => typeof navigator.vibrate === 'function';

  function loop(getEnergy) {
    const e = getEnergy();
    if (e < 0.04) { stop(); return; }
    if (has()) {
      // Duration is the only intensity proxy the API exposes.
      ok = navigator.vibrate(Math.round(8 + e * 45)) !== false;
      calls++;
    }
    timer = setTimeout(() => loop(getEnergy), 240 - e * 195);
  }

  function stop() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (has()) { try { navigator.vibrate(0); } catch (_) {} }
  }

  return {
    start(getEnergy) { if (!timer) loop(getEnergy); },
    stop,
    stats: () => ({ has: has(), calls, ok }),
  };
})();

/* ─────────────────────── pointer input ─────────────────────── *
 * Pointer Events rather than Touch Events, and deliberately WITHOUT
 * preventDefault on move: `touch-action:none` already suppresses scrolling,
 * and the vibration polyfill drives its strongest haptic path off real
 * pointermove events reaching its overlaid switch elements. Swallowing
 * those events would starve it.
 */
const pointers = new Map();
let globalEnergy = 0;

function bindPointer() {
  const at = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  canvas.addEventListener('pointerdown', (e) => {
    const { x, y } = at(e);
    pointers.set(e.pointerId, { x, y, energy: 0 });
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    Haptics.start(() => globalEnergy);
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const { x, y } = at(e);
    p.x = x; p.y = y;
  });

  const up = (e) => pointers.delete(e.pointerId);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('lostpointercapture', up);
}

/* ─────────────────────────── simulation ─────────────────────────── */
const GRAVITY   = 0.055;
const DRAG_CALM = 0.972;
const DRAG_WILD = 0.991;
const JITTER    = 0.014;
const RADIUS    = 190;
const PUSH      = 1.5;
const SWIRL     = 1.15;
const CHAOS     = 1.9;
const BOUNCE    = 0.34;

let last = performance.now();
let fps = 0;

function step(now) {
  const dtms = now - last;
  const dt = Math.min(dtms / 16.667, 2.2);
  last = now;
  fps += (1000 / Math.max(dtms, 1) - fps) * 0.06;
  const t = now * 0.001;

  grav.x += (grav.tx - grav.x) * 0.075 * dt;
  grav.y += (grav.ty - grav.y) * 0.075 * dt;

  let maxE = 0;
  for (const p of pointers.values()) {
    p.energy += (1 - p.energy) * 0.035 * dt;
    if (p.energy > maxE) maxE = p.energy;
  }
  globalEnergy += (maxE - globalEnergy) * (maxE > globalEnergy ? 0.06 : 0.022) * dt;
  if (globalEnergy < 0.001) globalEnergy = 0;

  const E = globalEnergy;
  const drag = Math.pow(DRAG_CALM + (DRAG_WILD - DRAG_CALM) * E, dt);
  const jitter = JITTER * (1 + E * 22);

  for (const p of P) {
    p.vx += grav.x * GRAVITY * p.mass * dt;
    p.vy += grav.y * GRAVITY * p.mass * dt;

    p.vx += Math.sin(p.y * 0.0075 + t * 0.31 + p.seed) * 0.017 * dt;
    p.vy += Math.cos(p.x * 0.0075 - t * 0.27 + p.seed) * 0.017 * dt;

    p.vx += (Math.random() - 0.5) * jitter * dt;
    p.vy += (Math.random() - 0.5) * jitter * dt;

    for (const tc of pointers.values()) {
      const dx = p.x - tc.x, dy = p.y - tc.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > RADIUS * RADIUS) continue;
      const d = Math.sqrt(d2) || 0.001;
      const f = 1 - d / RADIUS;
      const ff = f * f * tc.energy * dt;
      const nx = dx / d, ny = dy / d;
      p.vx += nx * PUSH * ff;
      p.vy += ny * PUSH * ff;
      p.vx += -ny * SWIRL * ff;
      p.vy +=  nx * SWIRL * ff;
      p.vx += (Math.random() - 0.5) * CHAOS * ff;
      p.vy += (Math.random() - 0.5) * CHAOS * ff;
    }

    p.vx *= drag;
    p.vy *= drag;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.x < 0)      { p.x = 0; p.vx =  Math.abs(p.vx) * BOUNCE; }
    else if (p.x > W) { p.x = W; p.vx = -Math.abs(p.vx) * BOUNCE; }
    if (p.y < 0)      { p.y = 0; p.vy =  Math.abs(p.vy) * BOUNCE; }
    else if (p.y > H) { p.y = H; p.vy = -Math.abs(p.vy) * BOUNCE; }
  }

  draw(t, E);
  if (DEBUG) drawHud();
  requestAnimationFrame(step);
}

/* ─────────────────────────── render ─────────────────────────── */
function draw(t, E) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = `rgba(0,0,0,${0.42 - E * 0.30})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (const p of P) {
    const tw = 0.78 + 0.22 * Math.sin(t * p.tw + p.seed);
    const s = p.r * 7.5;
    ctx.globalAlpha = Math.min(1, p.alpha * tw * (1 + E * 0.5));
    ctx.drawImage(sprite, p.x - s / 2, p.y - s / 2, s, s);
  }
  for (const tc of pointers.values()) {
    const s = RADIUS * 2 * (0.35 + tc.energy * 0.65);
    ctx.globalAlpha = 0.05 + tc.energy * 0.10;
    ctx.drawImage(sprite, tc.x - s / 2, tc.y - s / 2, s, s);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  if (DEBUG) {
    // Gravity arrow from screen centre — should point at the floor.
    const cx = W / 2, cy = H / 2, L = 70;
    ctx.strokeStyle = '#6f6'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + grav.x * L, cy + grav.y * L);
    ctx.stroke();
    ctx.fillStyle = '#6f6';
    ctx.beginPath();
    ctx.arc(cx + grav.x * L, cy + grav.y * L, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawHud() {
  const [a, b, c] = grav.raw;
  const h = Haptics.stats();
  const deg = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
  hud.textContent =
    `src    ${grav.src}   perm ${grav.perm}\n` +
    `raw    ${a.toFixed(2)} ${b.toFixed(2)} ${c.toFixed(2)}\n` +
    `grav   x ${grav.x.toFixed(3)}  y ${grav.y.toFixed(3)}\n` +
    `angle  ${deg}   ios ${IS_IOS}  sign ${SIGN}\n` +
    `vibrate ${h.has}  kind ${window.__polyfillKind || '?'}\n` +
    `calls  ${h.calls}  ok ${h.ok}\n` +
    `energy ${globalEnergy.toFixed(3)}  ptrs ${pointers.size}\n` +
    `fps    ${fps.toFixed(0)}  dust ${P.length}`;
}

/* ─────────────────────────── boot ─────────────────────────── */
async function start() {
  gate.classList.add('hide');
  setTimeout(() => { if (gate.parentNode) gate.remove(); }, 900);

  const DME = window.DeviceMotionEvent;
  const DOE = window.DeviceOrientationEvent;

  try {
    if (DME && typeof DME.requestPermission === 'function') {
      grav.perm = await DME.requestPermission();          // iOS 13+ gesture-gated
      if (grav.perm === 'granted') {
        window.addEventListener('devicemotion', onMotion);
        if (DOE) window.addEventListener('deviceorientation', onOrientation);
      }
    } else {
      grav.perm = 'implicit';
      if (DME) window.addEventListener('devicemotion', onMotion);
      if (DOE) window.addEventListener('deviceorientation', onOrientation);
    }
  } catch (err) {
    grav.perm = 'error:' + err.name;
  }

  if (typeof navigator.vibrate === 'function') {
    try { navigator.vibrate(1); } catch (_) {}   // prime inside the gesture
  }

  bindPointer();
  last = performance.now();
  requestAnimationFrame(step);
}

gate.addEventListener('click', start, { once: true });

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
if (screen.orientation) screen.orientation.addEventListener('change', () => setTimeout(resize, 150));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pointers.clear(); Haptics.stop(); }
});
document.addEventListener('gesturestart', (e) => e.preventDefault());

resize();
draw(0, 0);
if (DEBUG) drawHud();
})();
</script>
</body>
</html>
